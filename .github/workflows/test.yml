name: Test Nexus Notify API
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'nexus-icon.svg'
      - 'README.md'
      - 'SECURITY.md'
      - '.gitignore'
      - 'openapi.yaml'
      - '.env.example'
      - 'server.js'
      - 'db/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm audit --omit=dev
      - run: npm test
